name: Windows distributables

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build PyInstaller and portable archive
        shell: pwsh
        run: .\packaging\build.ps1
      - name: Install Inno Setup
        if: ${{ hashFiles('dist/VirtualTaylorFrame-Setup.exe') == '' }}
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\VirtualTaylorFrame.iss'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTaylorFrame-Windows
          path: |
            dist/VirtualTaylorFrame-Setup.exe
            dist/VirtualTaylorFrame-Portable.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VirtualTaylorFrame-Setup.exe
            dist/VirtualTaylorFrame-Portable.zip
